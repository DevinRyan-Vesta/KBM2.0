# Compose override for running KBM behind an EXISTING, EXTERNAL Traefik that is
# already on the host (e.g. a shared/central Traefik that owns ports 80/443 and
# fronts other apps too). This is different from compose.traefik.yaml, which
# starts KBM's OWN Traefik — you can't do that when another proxy already holds
# 80/443.
#
# Enable by setting COMPOSE_FILE in .env:
#
#     COMPOSE_FILE=compose.yaml:compose.external-traefik.yaml
#
# Host layout (BASE_DOMAIN=vkeys.app):
#   vkeys.app             -> app (public landing page)      router kbm-platform
#   www.vkeys.app         -> app (301s to apex in-app)      router kbm-platform
#   admin.vkeys.app       -> app (app-admin interface)      router kbm-platform
#   vesta.vkeys.app       -> app (known tenant, HTTP-01)    router kbm-tenants-known
#   *.vkeys.app           -> app (any tenant, forwardauth)  router kbm-tenants
#   vkeys.io + subdomains -> 308 redirect to vkeys.app      routers kbm-io-*
#   buywithvesta.com + *  -> 308 redirect to vkeys.app      routers kbm-old-*
#
# TLS strategy:
#   - letsencrypt resolver (HTTP-01, defined in the central Traefik) covers all
#     EXPLICIT hostnames above — works with plain A records, no DNS API needed.
#   - hostingerdns resolver (DNS-01 via the Hostinger API) issues the
#     *.vkeys.app / *.vkeys.io wildcards used by the catch-all tenant routers.
#     Until HOSTINGER_API_TOKEN is set in the central Traefik's .env, wildcard
#     issuance fails quietly and only NEW tenant subdomains (beyond the known
#     ones listed here) serve a default cert. Known tenants are unaffected.
#   - cfdns resolver (Cloudflare DNS-01) still holds the *.buywithvesta.com
#     wildcard for the legacy-domain redirects.
#
# Env vars (from /opt/kbm/.env): BASE_DOMAIN, OLD_DOMAIN (default
# buywithvesta.com), ALT_DOMAIN (default vkeys.io), INTERNAL_API_SECRET.
#
# The in-app updater records the active config_files on the container and
# reconstructs this same merge on every `up -d`, so updates never silently
# fall back to Caddy.

services:
  caddy:
    profiles: ["disabled"]

  python-app:
    # Loopback publish for the host-network external Traefik's forwardauth call.
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      - "traefik.enable=true"
      # Explicit, project-prefixed network name so the external Traefik picks
      # the right container IP without guessing.
      - "traefik.docker.network=kbm_appnet"
      - "traefik.http.services.kbm-app.loadbalancer.server.port=8000"

      # ---- Router: platform hosts (apex landing page, www, admin) ----
      # The app itself routes by host: apex -> landing, www -> 301 apex,
      # admin -> app-admin interface. One router, one HTTP-01 cert.
      - "traefik.http.routers.kbm-platform.rule=Host(`${BASE_DOMAIN}`) || Host(`www.${BASE_DOMAIN}`) || Host(`admin.${BASE_DOMAIN}`)"
      - "traefik.http.routers.kbm-platform.priority=100"
      - "traefik.http.routers.kbm-platform.entrypoints=websecure"
      - "traefik.http.routers.kbm-platform.tls=true"
      - "traefik.http.routers.kbm-platform.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kbm-platform.service=kbm-app"

      # ---- Router: known tenant subdomains (explicit HTTP-01 certs) ----
      # Lists live tenants so they get valid certs even without the Hostinger
      # DNS token. Add new tenants here OR set HOSTINGER_API_TOKEN in the
      # central Traefik so the wildcard below covers everything.
      - "traefik.http.routers.kbm-tenants-known.rule=Host(`vesta.${BASE_DOMAIN}`)"
      - "traefik.http.routers.kbm-tenants-known.priority=50"
      - "traefik.http.routers.kbm-tenants-known.entrypoints=websecure"
      - "traefik.http.routers.kbm-tenants-known.tls=true"
      - "traefik.http.routers.kbm-tenants-known.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kbm-tenants-known.service=kbm-app"
      - "traefik.http.routers.kbm-tenants-known.middlewares=tenant-gate@docker"

      # ---- Router: wildcard tenant subdomains (one *.${BASE_DOMAIN} cert) ----
      - "traefik.http.routers.kbm-tenants.rule=HostRegexp(`^[a-z0-9-]+\\.${BASE_DOMAIN}$`)"
      - "traefik.http.routers.kbm-tenants.priority=1"
      - "traefik.http.routers.kbm-tenants.entrypoints=websecure"
      - "traefik.http.routers.kbm-tenants.tls=true"
      - "traefik.http.routers.kbm-tenants.tls.certresolver=hostingerdns"
      - "traefik.http.routers.kbm-tenants.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.kbm-tenants.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.routers.kbm-tenants.service=kbm-app"
      - "traefik.http.routers.kbm-tenants.middlewares=tenant-gate@docker"
      # Host-network Traefik reaches the app via the loopback publish above.
      - "traefik.http.middlewares.tenant-gate.forwardauth.address=http://127.0.0.1:8000/_internal/check-domain?secret=${INTERNAL_API_SECRET}"
      - "traefik.http.middlewares.tenant-gate.forwardauth.trustForwardHeader=true"

      # ---- Routers: vkeys.io -> vkeys.app redirects ----
      - "traefik.http.routers.kbm-io-apex.rule=Host(`${ALT_DOMAIN:-vkeys.io}`) || Host(`www.${ALT_DOMAIN:-vkeys.io}`)"
      - "traefik.http.routers.kbm-io-apex.priority=95"
      - "traefik.http.routers.kbm-io-apex.entrypoints=websecure"
      - "traefik.http.routers.kbm-io-apex.tls=true"
      - "traefik.http.routers.kbm-io-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kbm-io-apex.service=kbm-app"
      - "traefik.http.routers.kbm-io-apex.middlewares=kbm-io-redirect"
      - "traefik.http.middlewares.kbm-io-redirect.redirectregex.regex=^https?://(?:www\\.)?${ALT_DOMAIN:-vkeys.io}/(.*)"
      - "traefik.http.middlewares.kbm-io-redirect.redirectregex.replacement=https://${BASE_DOMAIN}/$${1}"
      - "traefik.http.middlewares.kbm-io-redirect.redirectregex.permanent=true"

      # Tenant subdomains on .io map to the same subdomain on .app. Wildcard
      # cert comes from hostingerdns (until then these serve a default cert —
      # the redirect still works for clients that click through).
      - "traefik.http.routers.kbm-io-tenants.rule=HostRegexp(`^[a-z0-9-]+\\.${ALT_DOMAIN:-vkeys.io}$`)"
      - "traefik.http.routers.kbm-io-tenants.priority=90"
      - "traefik.http.routers.kbm-io-tenants.entrypoints=websecure"
      - "traefik.http.routers.kbm-io-tenants.tls=true"
      - "traefik.http.routers.kbm-io-tenants.tls.certresolver=hostingerdns"
      - "traefik.http.routers.kbm-io-tenants.tls.domains[0].main=${ALT_DOMAIN:-vkeys.io}"
      - "traefik.http.routers.kbm-io-tenants.tls.domains[0].sans=*.${ALT_DOMAIN:-vkeys.io}"
      - "traefik.http.routers.kbm-io-tenants.service=kbm-app"
      - "traefik.http.routers.kbm-io-tenants.middlewares=kbm-io-tenant-redirect"
      - "traefik.http.middlewares.kbm-io-tenant-redirect.redirectregex.regex=^https?://([a-z0-9-]+)\\.${ALT_DOMAIN:-vkeys.io}/(.*)"
      - "traefik.http.middlewares.kbm-io-tenant-redirect.redirectregex.replacement=https://$${1}.${BASE_DOMAIN}/$${2}"
      - "traefik.http.middlewares.kbm-io-tenant-redirect.redirectregex.permanent=true"

      # ---- Routers: legacy buywithvesta.com -> vkeys.app redirects ----
      # Certs still come from the Cloudflare DNS-01 wildcard already in
      # acme.json, so old bookmarks get a clean HTTPS redirect.
      - "traefik.http.routers.kbm-old-apex.rule=Host(`${OLD_DOMAIN:-buywithvesta.com}`) || Host(`www.${OLD_DOMAIN:-buywithvesta.com}`)"
      - "traefik.http.routers.kbm-old-apex.priority=95"
      - "traefik.http.routers.kbm-old-apex.entrypoints=websecure"
      - "traefik.http.routers.kbm-old-apex.tls=true"
      - "traefik.http.routers.kbm-old-apex.tls.certresolver=cfdns"
      - "traefik.http.routers.kbm-old-apex.tls.domains[0].main=${OLD_DOMAIN:-buywithvesta.com}"
      - "traefik.http.routers.kbm-old-apex.tls.domains[0].sans=*.${OLD_DOMAIN:-buywithvesta.com}"
      - "traefik.http.routers.kbm-old-apex.service=kbm-app"
      - "traefik.http.routers.kbm-old-apex.middlewares=kbm-old-redirect"
      - "traefik.http.middlewares.kbm-old-redirect.redirectregex.regex=^https?://(?:www\\.)?${OLD_DOMAIN:-buywithvesta.com}/(.*)"
      - "traefik.http.middlewares.kbm-old-redirect.redirectregex.replacement=https://${BASE_DOMAIN}/$${1}"
      - "traefik.http.middlewares.kbm-old-redirect.redirectregex.permanent=true"

      - "traefik.http.routers.kbm-old-tenants.rule=HostRegexp(`^[a-z0-9-]+\\.${OLD_DOMAIN:-buywithvesta.com}$`)"
      - "traefik.http.routers.kbm-old-tenants.priority=90"
      - "traefik.http.routers.kbm-old-tenants.entrypoints=websecure"
      - "traefik.http.routers.kbm-old-tenants.tls=true"
      - "traefik.http.routers.kbm-old-tenants.tls.certresolver=cfdns"
      - "traefik.http.routers.kbm-old-tenants.tls.domains[0].main=${OLD_DOMAIN:-buywithvesta.com}"
      - "traefik.http.routers.kbm-old-tenants.tls.domains[0].sans=*.${OLD_DOMAIN:-buywithvesta.com}"
      - "traefik.http.routers.kbm-old-tenants.service=kbm-app"
      - "traefik.http.routers.kbm-old-tenants.middlewares=kbm-old-tenant-redirect"
      - "traefik.http.middlewares.kbm-old-tenant-redirect.redirectregex.regex=^https?://([a-z0-9-]+)\\.${OLD_DOMAIN:-buywithvesta.com}/(.*)"
      - "traefik.http.middlewares.kbm-old-tenant-redirect.redirectregex.replacement=https://$${1}.${BASE_DOMAIN}/$${2}"
      - "traefik.http.middlewares.kbm-old-tenant-redirect.redirectregex.permanent=true"
